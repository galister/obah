[package]
name = "obah"
version = "0.1.1"
edition = "2024"
description = "OpenVR bindings TUI for xrizer, VapoR, OpenComposite"
repository = "https://github.com/galister/obah"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.29"
dialoguer = "0.11"
keyvalues-parser = "0.2.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
